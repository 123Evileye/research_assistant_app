<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>管理员面板 · 科研助手</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: #f6f7fb; color: #1f2937; padding: 32px;
    }
    .container {
      max-width: 760px; margin: 0 auto; background: #fff;
      border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px;
    }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    a { color: #2563eb; text-decoration: none; font-size: 14px; }
    .alert {
      background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
      padding: 14px; border-radius: 8px; font-size: 14px; line-height: 1.6;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { border-bottom: 1px solid #e5e7eb; text-align: left; padding: 10px 8px; }
    th { color: #6b7280; font-size: 12.5px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <h2>🛡️ 管理员权限面板（仅 admin 可见）</h2>
      <a href="/">← 返回工作台</a>
    </div>
    <p style="font-size: 13px; color: #6b7280; margin-bottom: 16px;">
      当前登录用户：<strong>{{ user.username }}</strong>（角色：<code>{{ user.role }}</code>）
    </p>

    {% if error %}
      <div class="alert">
        <strong>权限拦截生效！</strong><br />
        {{ error }}<br />
        <small>提示：请退出登录并改用 <code>admin / admin123</code> 登录后再访问本页面。</small>
      </div>
    {% else %}
      <table>
        <thead>
          <tr><th>ID</th><th>用户名</th><th>角色 (Role)</th><th>创建时间 (UTC)</th></tr>
        </thead>
        <tbody>
          {% for u in users %}
            <tr>
              <td>{{ u.id }}</td>
              <td>{{ u.username }}</td>
              <td><code>{{ u.role }}</code></td>
              <td>{{ u.created_at }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% endif %}
  </div>
</body>
</html>
