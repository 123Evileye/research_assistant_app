<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 科研助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1f2937;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }
    h1 { font-size: 20px; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 18px; }
    .alert {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .alert.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .alert.success { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: #2563eb; }
    .btn-row { display: flex; gap: 10px; margin-top: 18px; }
    button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #d1d5db;
      background: #fff;
      color: #374151;
    }
    button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    button.primary:hover { background: #1d4ed8; }
    .demo-box {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      font-size: 12.5px;
      color: #475569;
      line-height: 1.7;
    }
    code { background: #e2e8f0; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📚 科研助手 · 登录</h1>
    <div class="subtitle">纯 Flask 前后端分离（JWT 登录 & RBAC 接口权限演练）</div>

    {% if error %}
      <div class="alert error">{{ error }}</div>
    {% endif %}
    {% if success %}
      <div class="alert success">{{ success }}</div>
    {% endif %}

    <form id="authForm" method="POST" action="/login">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" required placeholder="例如 admin 或 researcher" />

      <label for="password">密码</label>
      <input id="password" name="password" type="password" required placeholder="输入密码" />

      <div class="btn-row">
        <button type="submit" class="primary">登录</button>
        <button type="submit" formaction="/register">注册普通账号</button>
      </div>
    </form>

    <div class="demo-box">
      <div><strong>演练预置账号：</strong></div>
      <div>• 管理员：<code>admin</code> / <code>admin123</code>（可上传/删除/管理）</div>
      <div>• 普通研究员：<code>researcher</code> / <code>user123</code>（仅查论文与问答，上传会触发 403）</div>
      <div style="margin-top: 6px; color: #64748b;">当前对接后端：<code>{{ backend_url }}</code></div>
    </div>
  </div>
</body>
</html>
